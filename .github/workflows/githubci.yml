name: Arduino Library CI

# workflow_dispatch lets you run this from the Actions tab, or with
# `gh workflow run "Arduino Library CI"`, without needing a push.
on: [pull_request, push, repository_dispatch, workflow_dispatch]

jobs:
  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check library against Library Manager submission rules
      uses: arduino/arduino-lint-action@v3
      with:
        compliance: strict
        library-manager: submit
        project-type: library

  build:
    name: Build examples
    runs-on: ubuntu-latest

    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
         repository: adafruit/ci-arduino
         path: ci

    - name: Install the prerequisites
      run: bash ci/actions_install.sh

    - name: Check for correct code formatting with clang-format
      run: python3 ci/run-clang-format.py -e "ci/*" -e "bin/*" -r .

    - name: Test the code on supported platforms
      run: python3 ci/build_platform.py main_platforms
